<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quotes App</title>
</head>
<body>
  <h1>Quotes App</h1>
  
  <div>
    <button onclick="displayRandomQuote()">Show Random Quote</button>
    <button onclick="createAddQuoteForm()">Add Quote</button>
    <button onclick="exportToJsonFile()">Export Quotes</button>
    <input type="file" id="fileInput" onchange="importFromJsonFile(event)" />
    <button onclick="syncQuotes()">Sync Now</button>
  </div>

  <div id="notification" style="display:none; background:#ffefc1; padding:10px; margin:10px 0; border:1px solid #ccc;"></div>

  <div id="quoteDisplay"></div>
  <div id="formContainer"></div>
  <div id="categoryFilter"></div>

  <script src="script.js"></script>
</body>
</html>
